name: live

# 对真实的 OpenAlex 跑一遍冒烟测试（test/openalex.live.test.ts）：只按文档实现、用模拟响应测过的请求形状在这里核对。
# 手动触发，或改了适配器 / 维度注册表 / 这份测试时跑；不进推送的 check（外部服务的抖动不该挡住发版）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/openalex.ts
      - src/openalex-counts.ts
      - scripts/probe-openalex.mjs
      - src/dimensions.ts
      - test/openalex.live.test.ts
      - .github/workflows/live.yml

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 设了仓库 secret OPENALEX_API_KEY 就带上（适配器只把它放进请求头，不进 URL、不进日志）；没设按无 key 的额度跑
      - name: 有界 OpenAlex 合约探针（最多 6 次，无重试）
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node scripts/probe-openalex.mjs openalex-live-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openalex-contract-receipt
          path: openalex-live-receipt.json
          if-no-files-found: warn
      - name: OpenAlex 真实 API 冒烟测试（最多 80 次实际请求，费用按响应记录）
        env:
          OPENALEX_LIVE: '1'
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: pnpm jest test/openalex.live.test.ts
